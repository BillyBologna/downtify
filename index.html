<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel QR</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mu:#6b6b6b;--bd:#ddd;--ac:#2563eb;--card:#f6f6f7;--er:#c0262d}
@media(prefers-color-scheme:dark){:root{--bg:#131313;--fg:#eee;--mu:#999;--bd:#333;--ac:#6ea0ff;--card:#1d1d1d;--er:#ff7b80}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:860px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.4em 0}.mu{color:var(--mu);font-size:13px}.er{color:var(--er)}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
input,select{width:100%}button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 160px}.row>button{flex:0 0 auto}
.b{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.bar{height:8px;background:var(--ac);border-radius:4px}.qr{width:260px;max-width:100%;height:auto;background:#fff;border-radius:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{width:64px;height:64px;padding:3px;background:#fff;color:var(--fg);border:2px solid var(--bd);border-radius:10px}.chip.on{border-color:var(--ac)}.chip img{width:100%;height:100%;display:block}
input[type=color]{height:40px;padding:2px;cursor:pointer}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}.tabs{display:flex;gap:8px}
#t{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;display:none}
</style>
</head>
<body>
<main id="app"></main><div id="t"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="disenador.js"></script>
<script>
// === Configuracion: cambia solo estas tres lineas ===
const CFG = { api: 'https://qr-api.aramcad.com', auth: 'https://qr-auth.aramcad.com', short: 'https://qr.aramcad.com' };

const S = { tok: null, esp: null, plan: null, codes: [], cnt: {}, sel: null };
const app = document.getElementById('app');
const render = (...k) => app.replaceChildren(...k.flat().filter(x => x != null && x !== false));
const lsGet = k => { try { return localStorage.getItem(k) } catch { return null } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} };
function h(tag, p = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(p)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v);
  }
  e.append(...kids.flat().filter(x => x != null && x !== false));
  return e;
}
function toast(m) { const t = document.getElementById('t'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.i); toast.i = setTimeout(() => t.style.display = 'none', 3500); }

// --- red ---
async function post(path, body) {
  const r = await fetch(CFG.auth + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
  return d;
}
const guardar = d => { S.tok = d.access_token; lsSet('qr_rt', d.refresh_token); };
let refreshing = null;
function refresh() {
  const rt = lsGet('qr_rt');
  if (!rt) return Promise.reject(new Error('Sin sesion'));
  refreshing ??= post('/refresh', { refresh_token: rt }).then(guardar).finally(() => refreshing = null);
  return refreshing;
}
async function api(path, opt = {}, retry = true) {
  const r = await fetch(CFG.api + path, { ...opt, headers: { Authorization: 'Bearer ' + S.tok, 'Content-Type': 'application/json', ...opt.headers } });
  if (r.status === 401 && retry) { await refresh(); return api(path, opt, false); }
  const t = await r.text(); const d = t ? JSON.parse(t) : null;
  if (!r.ok) throw new Error(d && d.message || 'Error ' + r.status);
  return d;
}
const rpc = (fn, args) => api('/rpc/' + fn, { method: 'POST', body: JSON.stringify(args) });

// --- QR ---
const HEX = /^#[0-9a-f]{6}$/i;
function qrSvg(text, fg, bg, logo) {
  const q = qrcode(0, logo ? 'H' : 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 4, s = n + 2 * m; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m},${r + m}h1v1h-1z`;
  const L = logo ? Math.round(n * 0.2) : 0, o = (s - L) / 2;
  const lg = logo ? `<rect x="${o - 1}" y="${o - 1}" width="${L + 2}" height="${L + 2}" rx="2" fill="${bg}"/><image x="${o}" y="${o}" width="${L}" height="${L}" href="${logo}"/>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="${bg}"/><path d="${d}" fill="${fg}"/>${lg}</svg>`;
}
const lum = x => { const v = [1, 3, 5].map(i => parseInt(x.substr(i, 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; };
const contraste = (a, b) => (Math.max(lum(a), lum(b)) + .05) / (Math.min(lum(a), lum(b)) + .05);
function descargar(blob, nombre) { const a = h('a', { href: URL.createObjectURL(blob), download: nombre }); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

const kpi = (t, v) => h('div', { class: 'card' }, h('div', { class: 'mu' }, t), h('strong', { style: 'font-size:22px' }, String(v)));
const enc = encodeURIComponent;
const TIPOS = {
  url: ['Enlace web', 'https://destino.com/pagina', v => v],
  wa: ['WhatsApp', 'Numero con codigo de pais, ej. 593991234567', v => 'https://wa.me/' + v.replace(/\D/g, '')],
  ig: ['Instagram', 'usuario (sin @)', v => 'https://instagram.com/' + enc(v.replace(/^@/, ''))],
  tk: ['TikTok', 'usuario (sin @)', v => 'https://tiktok.com/@' + enc(v.replace(/^@/, ''))],
  fb: ['Facebook', 'nombre de tu pagina', v => 'https://facebook.com/' + enc(v)],
  mp: ['Ubicacion (Google Maps)', 'direccion o nombre del lugar', v => 'https://www.google.com/maps/search/?api=1&query=' + enc(v)]
};
function linea(dias) {
  if (!dias.length) return h('p', { class: 'mu' }, 'Sin datos en este periodo');
  const W = 600, H = 140, mx = Math.max(1, ...dias.map(d => d.n)), st = dias.length > 1 ? (W - 20) / (dias.length - 1) : 0;
  const pts = dias.map((d, i) => (10 + i * st).toFixed(1) + ',' + (H - 20 - d.n / mx * (H - 40)).toFixed(1)).join(' ');
  const ns = 'http://www.w3.org/2000/svg', sv = document.createElementNS(ns, 'svg');
  sv.setAttribute('viewBox', '0 0 ' + W + ' ' + H); sv.setAttribute('style', 'width:100%;height:auto');
  const pl = document.createElementNS(ns, 'polyline');
  pl.setAttribute('points', pts); pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', 'currentColor'); pl.setAttribute('stroke-width', '2');
  const t = document.createElementNS(ns, 'text');
  t.setAttribute('x', 10); t.setAttribute('y', 12); t.setAttribute('font-size', 11); t.setAttribute('fill', 'currentColor');
  t.textContent = 'max ' + mx + ' por dia  ' + dias[0].k + ' a ' + dias[dias.length - 1].k;
  sv.append(pl, t); return sv;
}
async function verReglas(c, cont) {
  try {
    const r = await api('/reglas?codigo_id=eq.' + c.id + '&order=prioridad,id');
    const cond = h('select', {}, [['sistema', 'Sistema'], ['pais', 'Pais (EC, US...)'], ['idioma', 'Idioma (es, en...)']].map(x => h('option', { value: x[0] }, x[1])));
    const val = h('input', { placeholder: 'ios, android, EC, es...' }), des = h('input', { placeholder: 'https://destino' });
    const quitar = g => async () => { try { await api('/reglas?id=eq.' + g.id, { method: 'DELETE' }); verReglas(c, cont); } catch (e) { toast(e.message); } };
    const agregar = async () => {
      try {
        const v = cond.value === 'pais' ? val.value.trim().toUpperCase() : val.value.trim().toLowerCase();
        await api('/reglas', { method: 'POST', body: JSON.stringify({ codigo_id: c.id, condicion: cond.value, valor: v, destino: des.value.trim() }) });
        toast('Regla agregada'); verReglas(c, cont);
      } catch (e) { toast(e.message); }
    };
    cont.replaceChildren(h('div', { class: 'card' }, h('h3', {}, 'Reglas por visitante'),
      h('p', { class: 'mu' }, 'El mismo QR lleva a otro destino segun quien escanea. Se revisan en orden; si ninguna coincide va al destino principal. Sistemas: ios, android, windows, macos, linux.'),
      r.length ? r.map(g => h('div', { class: 'row' }, h('span', {}, g.condicion + ' = ' + g.valor + '  ->  ' + g.destino), h('button', { class: 's', onclick: quitar(g) }, 'Quitar'))) : h('p', { class: 'mu' }, 'Sin reglas.'),
      h('div', { class: 'row' }, cond, val, des, h('button', { onclick: agregar }, 'Agregar'))));
  } catch (e) { toast(e.message); }
}
const DIAS = ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'];
async function verStats(c, dias, cont) {
  try {
    const e = await rpc('estadisticas', { p_codigo: c.id, p_dias: dias });
    const sel = h('select', { onchange: () => verStats(c, Number(sel.value), cont) }, [7, 30, 90].map(d => h('option', { value: d }, 'Ultimos ' + d + ' dias')));
    sel.value = dias;
    const dif = e.anterior ? Math.round((e.total - e.anterior) / e.anterior * 100) + '% vs periodo anterior' : 'sin periodo anterior';
    const top = (t, a) => { const m = Math.max(1, ...a.map(x => x.n)); return h('div', { class: 'card' }, h('h3', {}, t),
      a.length ? a.map(x => h('div', {}, h('div', { class: 'mu' }, x.k + ': ' + x.n), h('div', { class: 'bar', style: 'width:' + Math.round(x.n / m * 100) + '%' }))) : h('div', { class: 'mu' }, 'Sin datos')); };
    const mp = {}; e.calor.forEach(x => mp[x.d + '-' + x.h] = x.n);
    const mx = Math.max(1, ...e.calor.map(x => x.n)), cel = [];
    [1, 2, 3, 4, 5, 6, 0].forEach(d => {
      cel.push(h('span', { class: 'mu' }, DIAS[d]));
      for (let hh = 0; hh < 24; hh++) { const n = mp[d + '-' + hh] || 0;
        cel.push(h('div', { title: DIAS[d] + ' ' + hh + ':00 = ' + n, style: 'height:14px;border-radius:2px;background:var(--ac);opacity:' + (n ? (0.2 + n / mx * 0.8).toFixed(2) : 0.07) })); }
    });
    cont.replaceChildren(h('div', {}, h('div', { class: 'row' }, sel),
      h('div', { class: 'row' }, kpi('Escaneos', e.total), kpi('Visitantes unicos', e.unicos), kpi('Cambio', dif)),
      h('div', { class: 'card' }, h('h3', {}, 'Por dia'), h('div', { style: 'color:var(--ac)' }, linea(e.dias))),
      h('div', { class: 'card' }, h('h3', {}, 'Cuando escanean (hora local de Ecuador)'), h('div', { style: 'display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;align-items:center' }, cel)),
      top('Paises', e.paises), top('Ciudades', e.ciudades), top('Dispositivos', e.dispositivos),
      top('Navegadores', e.navegadores), top('Idiomas', e.idiomas), top('De donde vienen', e.origenes)));
  } catch (er) { toast(er.message); }
}
// --- vistas ---
function vistaAuth() {
  let modo = 'in';
  const err = h('p', { class: 'er' });
  const draw = () => {
    const f = {
      email: h('input', { type: 'email', placeholder: 'correo', autocomplete: 'email' }),
      pass: h('input', { type: 'password', placeholder: 'clave (minimo 10 caracteres)', autocomplete: modo === 'in' ? 'current-password' : 'new-password' }),
      neg: h('input', { placeholder: 'Nombre de tu negocio' }),
      inv: h('input', { placeholder: 'Codigo de invitacion' })
    };
    const ir = h('button', { onclick: async () => {
      err.textContent = '';
      try {
        const d = modo === 'in'
          ? await post('/login', { email: f.email.value, password: f.pass.value })
          : await post('/registro', { email: f.email.value, password: f.pass.value, nombre: f.neg.value, invitacion: f.inv.value });
        guardar(d); await cargar();
      } catch (e) { err.textContent = e.message; }
    } }, modo === 'in' ? 'Entrar' : 'Crear cuenta');
    render(h('h1', {}, 'Panel de QR'), h('div', { class: 'card' },
      h('div', { class: 'tabs' }, h('button', { class: modo === 'in' ? '' : 's', onclick: () => { modo = 'in'; draw(); } }, 'Ingresar'),
        h('button', { class: modo === 'up' ? '' : 's', onclick: () => { modo = 'up'; draw(); } }, 'Registrarme')),
      h('label', {}, 'Correo'), f.email, h('label', {}, 'Clave'), f.pass,
      modo === 'up' && [h('label', {}, 'Negocio'), f.neg, h('label', {}, 'Invitacion'), f.inv],
      h('p', {}, ir), err));
  };
  draw();
}

async function cargar() {
  const esp = await api('/espacios');
  if (!esp.length) throw new Error('No tienes espacios');
  S.esp = esp[0];
  const planes = await api('/planes');
  S.plan = planes.find(p => p.id === S.esp.plan_id);
  S.codes = await api('/codigos?order=creado_en.desc');
  const c = await rpc('conteos', { p_espacio: S.esp.id });
  S.cnt = Object.fromEntries(c.map(x => [x.codigo_id, x]));
  S.sel = null; vistaPanel();
}

function vistaPanel() {
  const nombre = h('input', { placeholder: 'Nombre del QR (ej. Menu del local)' });
  const tipo = h('select', {}, Object.entries(TIPOS).map(([k, v]) => h('option', { value: k }, v[0])));
  const dest = h('input', { placeholder: TIPOS.url[1] });
  tipo.addEventListener('change', () => { dest.placeholder = TIPOS[tipo.value][1]; });
  const crear = h('button', { onclick: async () => {
    try { await rpc('crear_codigo', { p_espacio: S.esp.id, p_nombre: nombre.value, p_destino: TIPOS[tipo.value][2](dest.value.trim()) }); toast('QR creado'); await cargar(); }
    catch (e) { toast(e.message); }
  } }, 'Crear QR');
  const tot = Object.values(S.cnt).reduce((a, x) => [a[0] + Number(x.total), a[1] + Number(x.ultimos_30)], [0, 0]);
  const lista = S.codes.map(c => {
    const n = S.cnt[c.id] || { total: 0, ultimos_30: 0 };
    return h('div', { class: 'card' },
      h('div', { class: 'row' }, h('div', {}, h('strong', {}, c.nombre), ' ', h('span', { class: 'b' }, c.estado)),
        h('button', { class: 's', onclick: () => { S.sel = c.id; vistaDetalle(); } }, 'Abrir')),
      h('div', { class: 'mu' }, CFG.short + '/' + c.slug + '  →  ' + c.destino),
      h('div', { class: 'mu' }, n.total + ' escaneos (' + n.ultimos_30 + ' en 30 dias)'));
  });
  render(
    h('div', { class: 'row' }, h('h1', {}, S.esp.nombre), h('button', { class: 's', onclick: () => { post('/logout', { refresh_token: lsGet('qr_rt') || '' }).catch(() => {}); lsSet('qr_rt', null); S.tok = null; vistaAuth(); } }, 'Salir')),
    h('p', { class: 'mu' }, 'Plan ' + S.plan.nombre + ': ' + S.codes.length + ' de ' + S.plan.max_codigos + ' QR'),
    h('div', { class: 'row' }, kpi('Escaneos totales', tot[0]), kpi('Ultimos 30 dias', tot[1]), kpi('QR activos', S.codes.filter(c => c.estado === 'activo').length)),
    h('div', { class: 'card' }, h('h3', {}, 'Nuevo QR'), h('div', { class: 'row' }, tipo, nombre, dest, crear)),
    lista.length ? lista : h('p', { class: 'mu' }, 'Aun no tienes QR.'));
}

function vistaDetalle() {
  const c = S.codes.find(x => x.id === S.sel), url = CFG.short + '/' + c.slug, bloq = c.estado === 'bloqueado';
  const D = Object.assign({}, DEF, c.diseno || {});
  if (!LOGO_OK.test(D.logo || '')) D.logo = null;
  const nom = h('input', { value: c.nombre }), des = h('input', { type: 'url', value: c.destino });
  const est = h('select', {}, h('option', { value: 'activo' }, 'activo'), h('option', { value: 'pausado' }, 'pausado'));
  est.value = c.estado === 'pausado' ? 'pausado' : 'activo';
  const img = h('img', { class: 'qr', alt: 'QR' }), aviso = h('p', { class: 'er mu' }), pn = h('div', {}), stats = h('div', {}), reg = h('div', {});
  let pest = 'marco';
  const pinta = () => { img.src = svgUrl(qrDiseno(url, D)); aviso.textContent = !D.transp && contraste(hx(D.fg, '#000000'), hx(D.bg, '#ffffff')) < 3 ? 'Cuidado: poco contraste con el fondo; puede no escanear.' : ''; };
  const color = (k, t) => { const i = h('input', { type: 'color', value: hx(D[k], hx(D.fg, '#000000')) }); i.addEventListener('input', () => { D[k] = i.value; pinta(); }); return h('div', {}, h('label', {}, t), i); };
  const chip = (k, v) => h('button', { class: 'chip' + (D[k] === v ? ' on' : ''), title: v, onclick: () => { D[k] = v; pinta(); mostrar(); } }, h('img', { src: mini(D, k, v), alt: v }));
  const chips = k => h('div', { class: 'chips' }, OPC[k].map(v => chip(k, v)));
  const check = (k, t) => { const i = h('input', { type: 'checkbox', style: 'width:auto' }); i.checked = !!D[k]; i.addEventListener('change', () => { D[k] = i.checked; pinta(); mostrar(); }); return h('label', { style: 'display:flex;gap:8px;align-items:center' }, i, t); };
  const lf = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp', onchange: () => {
    const f = lf.files[0]; if (!f) return;
    if (f.size > 100000) { toast('El logo debe pesar menos de 100 KB'); return; }
    const fr = new FileReader();
    fr.onload = () => { if (LOGO_OK.test(fr.result)) { D.logo = fr.result; D.preset = null; pinta(); mostrar(); } else toast('Formato no valido'); };
    fr.readAsDataURL(f);
  } });
  const txt = h('input', { value: D.mtexto, maxlength: 20 }); txt.addEventListener('input', () => { D.mtexto = txt.value; pinta(); });
  const fnt = h('select', {}, Object.entries(FUENTES).map(([k, v]) => h('option', { value: k }, v[0]))); fnt.value = D.mfuente; fnt.addEventListener('change', () => { D.mfuente = fnt.value; pinta(); });
  const P = {
    marco: () => [chips('marco'), h('label', {}, 'Frase del marco'), txt, h('label', {}, 'Fuente de la frase'), fnt, color('mcolor', 'Color del marco')],
    forma: () => [chips('forma'), h('div', { class: 'row' }, color('fg', 'Color de la forma'), color('bg', 'Color de fondo')), check('transp', 'Fondo transparente'), D.transp && h('p', { class: 'mu' }, 'Con fondo transparente el QR solo se lee bien sobre fondos claros y lisos.'), check('grad', 'Degradado'), D.grad && h('div', { class: 'row' }, color('c2', 'Segundo color'), check('radial', 'Degradado radial'))],
    ojos: () => [h('h3', {}, 'Estilo del borde'), chips('borde'), color('cb', 'Color del borde'), h('h3', {}, 'Estilo del centro'), chips('centro'), color('cc', 'Color del centro')],
    logo: () => [h('label', {}, 'Subir logo (PNG, JPG o WebP, maximo 100 KB)'), lf, h('label', {}, 'O elige uno'),
      h('div', { class: 'chips' }, Object.entries(PRESETS).map(([k, u]) => h('button', { class: 'chip' + (D.preset === k ? ' on' : ''), onclick: () => { D.preset = k; D.logo = null; pinta(); mostrar(); } }, h('img', { src: u, alt: k })))),
      check('limpio', 'Eliminar el fondo detras del logo'), h('button', { class: 's', onclick: () => { D.logo = null; D.preset = null; lf.value = ''; pinta(); mostrar(); } }, 'Quitar logo')],
    nivel: () => [h('p', { class: 'mu' }, 'Mas correccion: el QR resiste mas dano o un logo mas grande, pero se ve mas denso. Con logo se usa siempre el nivel Mejor.'),
      h('div', { class: 'chips' }, [['L', 'Mas pequeno'], ['M', 'Medio'], ['Q', 'Alto'], ['H', 'Mejor']].map(([k, t]) => h('button', { class: 'chip' + (D.ecc === k ? ' on' : ''), style: 'width:auto;height:auto;padding:8px 12px', onclick: () => { D.ecc = k; pinta(); mostrar(); } }, t)))]
  };
  const NOM = { marco: 'Marco', forma: 'Forma', ojos: 'Ojos', logo: 'Logo', nivel: 'Legibilidad' };
  const mostrar = () => pn.replaceChildren(h('div', { class: 'tabs', style: 'flex-wrap:wrap' }, Object.keys(P).map(k => h('button', { class: k === pest ? '' : 's', onclick: () => { pest = k; mostrar(); } }, NOM[k]))), h('div', { style: 'margin-top:10px' }, ...P[pest]().flat().filter(Boolean)));
  const guardar = h('button', { onclick: async () => {
    try {
      const body = { nombre: nom.value, destino: des.value, diseno: D };
      if (!bloq) body.estado = est.value;
      const r = await api('/codigos?id=eq.' + c.id, { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify(body) });
      if (!r.length) throw new Error('No se pudo guardar');
      Object.assign(c, r[0]); toast('Guardado');
    } catch (e) { toast(e.message); }
  } }, 'Guardar');
  const svgBtn = h('button', { class: 's', onclick: () => descargar(new Blob([qrDiseno(url, D)], { type: 'image/svg+xml' }), c.slug + '.svg') }, 'Descargar SVG');
  const pngBtn = h('button', { class: 's', onclick: () => {
    const i = new Image();
    i.onload = () => { const k = 1024 / i.naturalWidth, cv = h('canvas', { width: 1024, height: Math.round(i.naturalHeight * k) }); cv.getContext('2d').drawImage(i, 0, 0, cv.width, cv.height); cv.toBlob(b => descargar(b, c.slug + '.png')); };
    i.src = svgUrl(qrDiseno(url, D));
  } }, 'Descargar PNG');
  const csvBtn = h('button', { class: 's', onclick: async () => {
    try {
      const r = await api('/escaneos?codigo_id=eq.' + c.id + '&select=ts,pais,ciudad,dispositivo,sistema,navegador,idioma,referer&order=ts.desc&limit=10000');
      const q = v => { let t = String(v ?? ''); if (/^[=+\-@]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };
      const cols = ['ts', 'pais', 'ciudad', 'dispositivo', 'sistema', 'navegador', 'idioma', 'referer'];
      descargar(new Blob([cols.join(',') + '\n' + r.map(x => cols.map(k => q(x[k])).join(',')).join('\n')], { type: 'text/csv' }), c.slug + '.csv');
    } catch (er) { toast(er.message); }
  } }, 'Exportar CSV');
  render(h('button', { class: 's', onclick: vistaPanel }, '← Volver'), h('h2', {}, c.nombre), h('p', { class: 'mu' }, url),
    bloq && h('p', { class: 'er' }, 'Este QR fue bloqueado por incumplir las condiciones de uso.'),
    h('div', { class: 'card' }, h('label', {}, 'Nombre'), nom, h('label', {}, 'Destino (donde lleva el QR)'), des, !bloq && [h('label', {}, 'Estado'), est], h('p', { class: 'mu' }, 'Los cambios de destino se aplican al instante.')),
    h('div', { class: 'card' }, h('h3', {}, 'Diseña tu QR'), h('div', { class: 'row', style: 'align-items:flex-start' }, h('div', { style: 'flex:1 1 320px' }, pn), h('div', { style: 'flex:0 1 280px' }, img, aviso))),
    h('div', { class: 'row' }, guardar, svgBtn, pngBtn, csvBtn, h('button', { class: 's', onclick: () => verStats(c, 30, stats) }, 'Ver estadisticas'), h('button', { class: 's', onclick: () => verReglas(c, reg) }, 'Reglas por visitante')),
    stats, reg);
  pinta(); mostrar();
}

// --- arranque ---
(async () => {
  if (lsGet('qr_rt')) { try { await refresh(); await cargar(); return; } catch { lsSet('qr_rt', null); } }
  vistaAuth();
})();
</script>
